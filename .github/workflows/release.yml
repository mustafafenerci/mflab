name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (örn: v1.0.1 - boş bırakılırsa pubspec.yaml sürümü kullanılır)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags network --file-reporter json:test-results.json
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path test-results.json)) { exit 0 }
          $names = @{}
          Get-Content test-results.json -Encoding utf8 | ForEach-Object {
            try { $e = $_ | ConvertFrom-Json } catch { return }
            if ($e.type -eq 'testStart') { $names[$e.test.id] = $e.test.name }
            if ($e.type -eq 'error') {
              $msg = (($e.error -split "`n") | Select-Object -First 4) -join ' | '
              $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", ' ')
              Write-Output "::error::[$($names[$e.testID])] $msg"
            }
          }
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $v = ""
          if ($ref -and $ref.StartsWith("v")) {
            $v = $ref.TrimStart('v')
          } elseif ("${{ inputs.tag }}") {
            $v = "${{ inputs.tag }}".TrimStart('v')
          } else {
            $pub = Get-Content pubspec.yaml | Select-String "^version:\s*([0-9\.]+)"
            $v = if ($pub) { $pub.Matches.Groups[1].Value } else { "1.0.0" }
          }
          $tag = "v" + $v
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Derlenecek Sürüm: $v | Etiket: $tag"
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\mflab.iss
      - name: Checksum
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $f = "dist\MFLab-Setup-v$v.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  MFLab-Setup-v$v.exe" | Out-File "$f.sha256" -Encoding ascii
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          files: |
            dist/MFLab-Setup-v${{ steps.ver.outputs.version }}.exe
            dist/MFLab-Setup-v${{ steps.ver.outputs.version }}.exe.sha256
          generate_release_notes: true

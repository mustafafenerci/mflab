name: mflab-vtys
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["6332:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data", "${WORKSPACE}:/sql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mflab.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["6350:80"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports: ["6307:3306"]
    volumes: ["maria_data:/var/lib/mysql", "${WORKSPACE}:/sql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: root
    ports: ["6382:80"]
    depends_on: [mariadb]
    restart: unless-stopped
volumes:
  pg_data:
  maria_data:

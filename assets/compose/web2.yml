name: mflab-web2
services:
  web:
    image: ghcr.io/mustafafenerci/mflab-php-web:latest
    build: ./php-web
    ports: ["8080:80"]
    volumes: ["${WORKSPACE}:/var/www/html"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mflab
    ports: ["3306:3306"]
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports: ["8081:80"]
    depends_on: [db]
    restart: unless-stopped
volumes:
  db_data:
